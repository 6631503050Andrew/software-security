name: security-ci

# Demo pipeline for Week 14 (DevSecOps). Runs SAST, SCA, and secret
# scanning, and fails the build on high-severity findings.
#
# Actions are pinned to commit SHAs (not mutable tags like @v4/@master) — the
# same supply-chain control Week 12 teaches. Bump the SHA and the trailing
# version comment together.
#
# What is gated: the platform code we actually run (labs/live-quiz, tools/).
# What is not: labs/week*/, labs/toolbox/ and project/starter-app/, which are
# intentionally vulnerable teaching material — students run these same scanners
# against them by hand and are graded on the findings.

on:
  push:
    branches: [ main, wk02 ]
  pull_request:
    branches: [ main, wk02 ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab

jobs:
  # The platform's own test suite. This job did not exist until 2026-07-31, and
  # its absence was not obvious: pull requests showed "4 checks passed" while
  # zero application tests ran — the 454 of them only ever executed on the
  # author's laptop, when the author remembered.
  #
  # That mattered more than it sounds. Four real defects shipped in one week,
  # and three were already covered by tests that simply never ran here:
  # a CSP that silently killed the projector screen, a double-click that ended a
  # student's graded quiz, and every `[`FILE.md`](FILE.md)` link rendering as
  # literal markdown. Writing the test was never the missing step; running it was.
  tests:
    name: Tests (live-quiz platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r labs/live-quiz/requirements.txt pytest
      # Run from the app directory: conftest.py sets throwaway DB/secret env
      # defaults before `import app`, and the content plane resolves CONTENT_ROOT
      # relative to the checkout, so the real 19 weeks are what gets tested.
      - name: Run the suite
        working-directory: labs/live-quiz
        run: python -m pytest tests/ -q

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Semgrep
        run: semgrep ci --config p/default
        env:
          SEMGREP_RULES: p/owasp-top-ten

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # .gitleaks.toml allowlists ONLY the credentials planted on purpose for the
          # Week 2 / Week 15 exercises; a real secret committed anywhere else still fails.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # gitleaks-action v2 calls the GitHub API to scan a pull_request's diff and now refuses
          # to run without a token for that (previously optional, now a hard requirement — see
          # https://github.com/gitleaks/gitleaks-action#-announcement). The default Actions token
          # already has the read access this needs; no new repo permission is required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA + image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Trivy filesystem scan (deps + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'      # fail the build on HIGH/CRITICAL
          # Without this, trivy-action builds the SARIF "with all severities" and
          # ignores `severity:` above — so a LOW finding fails the build even though
          # this job claims to gate on HIGH/CRITICAL only.
          limit-severities-for-sarif: true
          # labs/week*/ and project/starter-app/ are deliberately vulnerable teaching
          # material (old pins, root containers, planted secrets, a Dockerfile students
          # are asked to harden). Gating on them keeps the build red forever; students
          # see those findings by running the scanners inside the lab. labs/live-quiz
          # (the real platform) and everything else stay gated.
          skip-dirs: 'labs/week*,labs/toolbox,project/starter-app,instructor'
          format: sarif
          output: trivy-results.sarif
      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results.sarif
